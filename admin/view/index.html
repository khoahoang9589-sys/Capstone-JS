<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberTech Admin - Quản Lý Sản Phẩm (Laptop & iPhone)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <link rel="stylesheet" href="../../asset/css/main.css" />
</head>
<body class="bg-light">
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm py-3">
      <div class="container-fluid px-lg-5">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="./index.html">
          <i class="fa-solid fa-laptop-code text-warning fs-4 me-2"></i>
          <span>CyberTech <span class="badge bg-warning text-dark fs-6 ms-1">Admin</span></span>
        </a>

        <div class="d-flex align-items-center gap-2">
          <a href="../../index.html" class="btn btn-outline-light btn-sm px-3">
            <i class="fa-solid fa-store me-1"></i> Đến Gian Hàng
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="py-4">
    <div class="container-fluid px-lg-5">
      <div class="card border-0 shadow-sm rounded-3 mb-4">
        <div class="card-body p-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
              <h2 class="fw-bold mb-1 fs-4 text-dark">Quản Lý Danh Mục Laptop & iPhone</h2>
              <p class="text-secondary small mb-0">Thêm, sửa, xóa, tìm kiếm và sắp xếp các sản phẩm trong hệ thống</p>
            </div>

            <div>
              <button class="btn btn-primary d-flex align-items-center gap-2 px-3 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#productModal" id="btnThemSP">
                <i class="fa-solid fa-circle-plus"></i>
                <span class="fw-medium">Thêm Sản Phẩm Mới</span>
              </button>
            </div>
          </div>

          <div class="row g-3 align-items-center">
            <div class="col-md-6 col-lg-5">
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0">
                  <i class="fa-solid fa-magnifying-glass text-muted"></i>
                </span>
                <input type="text" id="txtSearch" class="form-control border-start-0 ps-0" placeholder="Tìm kiếm theo tên sản phẩm..." />
              </div>
            </div>

            <div class="col-md-4 col-lg-3">
              <div class="d-flex align-items-center gap-2">
                <span class="text-secondary small text-nowrap fw-semibold">Sắp xếp:</span>
                <select id="sortPrice" class="form-select form-select-sm">
                  <option value="default">Mặc định (ID)</option>
                  <option value="asc">Giá: Thấp đến Cao</option>
                  <option value="desc">Giá: Cao đến Thấp</option>
                </select>
              </div>
            </div>

            <div class="col-md-2 col-lg-4 text-md-end">
              <button class="btn btn-outline-secondary btn-sm" id="btnRefresh" title="Làm mới danh sách">
                <i class="fa-solid fa-arrows-rotate me-1"></i> Tải lại
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 text-nowrap">
              <thead class="table-dark">
                <tr>
                  <th scope="col" class="text-center" style="width: 60px;">STT</th>
                  <th scope="col" style="width: 100px;">Mã SP</th>
                  <th scope="col" style="width: 80px;">Ảnh</th>
                  <th scope="col">Tên sản phẩm</th>
                  <th scope="col" class="text-end" style="width: 120px;">Giá ($)</th>
                  <th scope="col" style="width: 130px;">Phân loại</th>
                  <th scope="col" style="min-width: 250px;">Mô tả</th>
                  <th scope="col" class="text-center" style="width: 130px;">Hành động</th>
                </tr>
              </thead>
              <tbody id="tblDanhSachSP">
                <tr>
                  <td colspan="8" class="text-center py-5 text-muted">
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title d-flex align-items-center" id="productModalLabel">
            <i class="fa-solid fa-laptop-code me-2 text-warning"></i>
            <span>Thông Tin Sản Phẩm</span>
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" id="btnCloseHeader"></button>
        </div>

        <div class="modal-body p-4">
          <form id="productForm" novalidate>
            <div class="row g-3">
              <div class="col-12" id="groupPhoneId">
                <label for="phoneId" class="form-label fw-semibold">Mã sản phẩm (ID) <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="phoneId" placeholder="VD: SP01 / ID01" />
                <span id="tbPhoneId" class="sp-thongbao text-danger"></span>
              </div>

              <div class="col-md-6">
                <label for="phoneName" class="form-label fw-semibold">Tên sản phẩm <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="phoneName" placeholder="VD: MacBook Pro 14 M3 / iPhone 15 Pro Max" />
                <span id="tbPhoneName" class="sp-thongbao text-danger"></span>
              </div>

              <div class="col-md-6">
                <label for="phonePrice" class="form-label fw-semibold">Giá bán (vnd) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="phonePrice" placeholder="VD: 1999" min="1" />
                <span id="tbPhonePrice" class="sp-thongbao text-danger"></span>
              </div>

              <div class="col-md-6">
                <label for="phoneType" class="form-label fw-semibold">Phân loại sản phẩm <span class="text-danger">*</span></label>
                <select class="form-select" id="phoneType">
                  <option value="">-- Chọn phân loại --</option>
                  <option value="LAPTOP">LAPTOP (Máy tính xách tay)</option>
                  <option value="iphone">iPhone (Điện thoại iPhone)</option>
                  <option value="tablet">Tablet (Điện thoại tablet)</option>
                  <option value="phone">Phone (Điện thoại bảng)</option>
                </select>
                <span id="tbPhoneType" class="sp-thongbao text-danger"></span>
              </div>

              <div class="col-md-6">
                <label for="phoneImg" class="form-label fw-semibold">Link hình ảnh (URL) <span class="text-danger">*</span></label>
                <input type="url" class="form-control" id="phoneImg" placeholder="https://cdn.tgdd.vn/..." />
                <span id="tbPhoneImg" class="sp-thongbao text-danger"></span>
              </div>

              <div class="col-12">
                <label for="phoneDesc" class="form-label fw-semibold">Mô tả sản phẩm <span class="text-danger">*</span></label>
                <textarea class="form-control" id="phoneDesc" rows="3" placeholder="Nhập mô tả tính năng nổi bật..."></textarea>
                <span id="tbPhoneDesc" class="sp-thongbao text-danger"></span>
              </div>
            </div>
          </form>
        </div>

        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCloseFooter">
            Đóng
          </button>
          <button type="button" class="btn btn-primary" id="btnAddPhone">
            <i class="fa-solid fa-plus me-1"></i> Thêm sản phẩm
          </button>
          <button type="button" class="btn btn-success d-none" id="btnUpdatePhone">
            <i class="fa-solid fa-check me-1"></i> Cập nhật sản phẩm
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-secondary py-3 mt-auto">
    <div class="container-fluid px-lg-5 text-center">
      <small>© 2026 CyberTech Admin Dashboard - CyberSoft Capstone Project</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script type="module" src="../controller/main.js"></script>
</body>
</html>
